##############################################################
# Global Configuration
##############################################################

global:

  scrape_interval: 15s

  evaluation_interval: 15s

  scrape_timeout: 10s

  external_labels:

    cluster: ai-platform

    environment: production

##############################################################
# Alertmanager
##############################################################

alerting:

  alertmanagers:

    - static_configs:

        - targets:

            - alertmanager:9093

##############################################################
# Rule Files
##############################################################

rule_files:

  - /etc/prometheus/rules/*.yml

##############################################################
# Scrape Configurations
##############################################################

scrape_configs:

##############################################################
# Prometheus
##############################################################

  - job_name: prometheus

    static_configs:

      - targets:

          - localhost:9090

##############################################################
# Backend Metrics
##############################################################

  - job_name: backend

    metrics_path: /metrics

    scrape_interval: 15s

    static_configs:

      - targets:

          - backend:8000

##############################################################
# Frontend Metrics
##############################################################

  - job_name: frontend

    metrics_path: /metrics

    scrape_interval: 30s

    static_configs:

      - targets:

          - frontend:3000

##############################################################
# NGINX Metrics
##############################################################

  - job_name: nginx

    metrics_path: /metrics

    static_configs:

      - targets:

          - nginx:9113

##############################################################
# Node Exporter
##############################################################

  - job_name: node-exporter

    static_configs:

      - targets:

          - node-exporter:9100

##############################################################
# cAdvisor
##############################################################

  - job_name: cadvisor

    static_configs:

      - targets:

          - cadvisor:8080

##############################################################
# Kubernetes API
##############################################################

  - job_name: kubernetes-apiservers

    kubernetes_sd_configs:

      - role: endpoints

    scheme: https

    tls_config:

      insecure_skip_verify: true

    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

    relabel_configs:

      - action: keep

        source_labels:
          - __meta_kubernetes_namespace
          - __meta_kubernetes_service_name

        regex: default;kubernetes

##############################################################
# Kubernetes Nodes
##############################################################

  - job_name: kubernetes-nodes

    kubernetes_sd_configs:

      - role: node

    scheme: https

    tls_config:

      insecure_skip_verify: true

    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

##############################################################
# Kubernetes Pods
##############################################################

  - job_name: kubernetes-pods

    kubernetes_sd_configs:

      - role: pod

    relabel_configs:

      - action: keep

        source_labels:

          - __meta_kubernetes_pod_annotation_prometheus_io_scrape

        regex: "true"

      - action: replace

        source_labels:

          - __meta_kubernetes_pod_annotation_prometheus_io_path

        target_label: __metrics_path__

      - action: replace

        source_labels:

          - __address__

          - __meta_kubernetes_pod_annotation_prometheus_io_port

        separator: ":"

        regex: (.+):(?:\d+);(\d+)

        replacement: $1:$2

        target_label: __address__

##############################################################
# Blackbox Exporter
##############################################################

  - job_name: blackbox-http

    metrics_path: /probe

    params:

      module:

        - http_2xx

    static_configs:

      - targets:

          - https://example.com

    relabel_configs:

      - source_labels:

          - __address__

        target_label: __param_target

      - source_labels:

          - __param_target

        target_label: instance

      - target_label: __address__

        replacement: blackbox-exporter:9115