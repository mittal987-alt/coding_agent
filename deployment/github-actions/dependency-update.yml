name: Dependency Updates

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TERRAFORM_VERSION: "1.10.0"

##############################################################
# Dependency Update Job
##############################################################

jobs:

  dependencies:

    name: Check Dependencies

    runs-on: ubuntu-latest

    steps:

##############################################################
# Checkout
##############################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

##############################################################
# Python
##############################################################

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install pip-tools
        run: |
          pip install pip-tools

      - name: Check Python Updates
        working-directory: backend
        run: |
          pip list --outdated

##############################################################
# Node
##############################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check npm Updates
        working-directory: frontend
        run: |
          npm install
          npm outdated || true

##############################################################
# Terraform
##############################################################

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: deployment/terraform
        run: |
          terraform init -backend=false

      - name: Check Providers
        working-directory: deployment/terraform
        run: |
          terraform providers

##############################################################
# Docker Base Images
##############################################################

      - name: Check Dockerfiles
        run: |
          echo "Backend Dockerfile"
          grep "^FROM" backend/Dockerfile

          echo "Frontend Dockerfile"
          grep "^FROM" frontend/Dockerfile

          echo "NGINX Dockerfile"
          grep "^FROM" deployment/nginx/Dockerfile

##############################################################
# Create Pull Request
##############################################################

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: weekly dependency updates"
          title: "Weekly Dependency Updates"
          body: |
            ## Automated Dependency Update

            This PR contains the latest dependency updates.

            ### Checked

            - Python packages
            - npm packages
            - Terraform providers
            - Docker base images

            Please review before merging.

          branch: automation/dependency-update
          delete-branch: true
          labels: |
            dependencies
            automation

##############################################################
# Summary
##############################################################

      - name: Summary
        run: |
          echo "======================================="
          echo " Weekly Dependency Check Complete"
          echo "======================================="