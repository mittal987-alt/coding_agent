name: Docker Images

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "deployment/nginx/**"
      - ".github/workflows/docker.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write

env:
  AWS_REGION: ap-south-1

jobs:

##############################################################
# Build and Publish Docker Images
##############################################################

  docker:

    name: Build & Push Images

    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - backend
          - frontend
          - nginx

    steps:

      ########################################################
      # Checkout
      ########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ########################################################
      # Setup QEMU
      ########################################################

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      ########################################################
      # Setup Buildx
      ########################################################

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      ########################################################
      # Configure AWS
      ########################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      ########################################################
      # Login to Amazon ECR
      ########################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ########################################################
      # Docker Metadata
      ########################################################

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/ai-platform/${{ matrix.service }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      ########################################################
      # Build Cache
      ########################################################

      - name: Restore Docker Cache
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.service }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ matrix.service }}

      ########################################################
      # Build & Push
      ########################################################

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service == 'nginx' && 'deployment/nginx' || matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}

      ########################################################
      # Move Cache
      ########################################################

      - name: Update Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

##############################################################
# Security Scan
##############################################################

  scan:

    name: Trivy Security Scan

    runs-on: ubuntu-latest

    needs: docker

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

##############################################################
# Sign Images
##############################################################

  sign:

    name: Sign Images

    runs-on: ubuntu-latest

    needs: docker

    steps:

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign Images
        run: |
          echo "Signing container images..."
          # Example:
          # cosign sign <image>

##############################################################
# Summary
##############################################################

  completed:

    name: Docker Pipeline Complete

    runs-on: ubuntu-latest

    needs:
      - docker
      - scan
      - sign

    if: always()

    steps:

      - name: Success
        run: |
          echo "====================================="
          echo " Docker Pipeline Completed"
          echo "====================================="