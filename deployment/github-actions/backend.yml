name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ai-platform/backend

jobs:

  ############################################################
  # Backend Quality
  ############################################################

  quality:

    name: Code Quality

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: backend-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy pytest pytest-cov

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: MyPy
        run: mypy .

  ############################################################
  # Tests
  ############################################################

  tests:

    name: Test Suite

    runs-on: ubuntu-latest

    needs: quality

    defaults:
      run:
        working-directory: backend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Tests
        run: |
          pytest \
            --cov=app \
            --cov-report=xml \
            --cov-report=term

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  ############################################################
  # Docker Build
  ############################################################

  docker:

    name: Build Backend Image

    runs-on: ubuntu-latest

    needs: tests

    steps:

      - uses: actions/checkout@v4

      - name: Set Image Tag
        id: vars
        run: |
          echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build Docker Image
        run: |
          docker build \
            -t backend:${{ steps.vars.outputs.tag }} \
            ./backend

      - name: Save Image
        run: |
          docker save \
          backend:${{ steps.vars.outputs.tag }} \
          > backend-image.tar

      - name: Upload Docker Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar

  ############################################################
  # Push to ECR
  ############################################################

  publish:

    name: Publish to Amazon ECR

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    needs: docker

    steps:

      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Image
        run: |
          docker build \
          -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
          ./backend

      - name: Tag Image
        run: |
          docker tag \
          ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
          ${{ steps.login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push Image
        run: |
          docker push \
          ${{ steps.login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  ############################################################
  # Success
  ############################################################

  complete:

    name: Backend Pipeline Complete

    runs-on: ubuntu-latest

    needs:
      - publish

    if: always()

    steps:

      - name: Pipeline Finished
        run: echo "Backend CI/CD completed."