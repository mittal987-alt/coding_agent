##############################################################
# Hide NGINX Version
##############################################################

server_tokens off;

##############################################################
# Security Headers
##############################################################

add_header X-Frame-Options "DENY" always;

add_header X-Content-Type-Options "nosniff" always;

add_header X-XSS-Protection "1; mode=block" always;

add_header Referrer-Policy "strict-origin-when-cross-origin" always;

add_header Permissions-Policy \
"accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()" always;

add_header Cross-Origin-Embedder-Policy "require-corp" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;

add_header Cross-Origin-Resource-Policy "same-origin" always;

##############################################################
# Content Security Policy
##############################################################

add_header Content-Security-Policy "
default-src 'self';
script-src 'self' 'unsafe-inline';
style-src 'self' 'unsafe-inline';
img-src 'self' data: https:;
font-src 'self' data:;
connect-src 'self' https: wss:;
object-src 'none';
frame-ancestors 'none';
base-uri 'self';
form-action 'self';
upgrade-insecure-requests;
" always;

##############################################################
# Allowed HTTP Methods
##############################################################

if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD)$ ) {
    return 405;
}

##############################################################
# Prevent Access to Hidden Files
##############################################################

location ~ /\. {

    deny all;

    access_log off;

    log_not_found off;
}

##############################################################
# Block Sensitive Files
##############################################################

location ~* \.(env|git|svn|hg|bak|config|sql|log|ini|yaml|yml|toml)$ {

    deny all;

    return 404;
}

##############################################################
# Block Backup Files
##############################################################

location ~* (~|\.swp|\.old|\.orig|\.save)$ {

    deny all;

    return 404;
}

##############################################################
# Prevent Directory Listing
##############################################################

autoindex off;

##############################################################
# Limit Connections
##############################################################

limit_conn conn_limit 50;

##############################################################
# Rate Limiting
##############################################################

limit_req zone=api_limit burst=40 nodelay;

##############################################################
# Large Request Protection
##############################################################

client_max_body_size 100M;

client_body_buffer_size 128k;

large_client_header_buffers 4 16k;

##############################################################
# Timeouts
##############################################################

client_header_timeout 15s;

client_body_timeout 15s;

send_timeout 30s;

keepalive_timeout 65s;

##############################################################
# Ignore Invalid Headers
##############################################################

ignore_invalid_headers on;

##############################################################
# Disable TRACE
##############################################################

if ($request_method = TRACE) {
    return 405;
}

##############################################################
# Prevent MIME Sniffing
##############################################################

types_hash_max_size 4096;

default_type application/octet-stream;