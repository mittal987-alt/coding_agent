# frontend-deployment.yaml
# ============================================================
# Frontend Service Account
# ============================================================

apiVersion: v1
kind: ServiceAccount

metadata:
  name: frontend-service-account
  namespace: ai-platform

  labels:
    app: frontend

automountServiceAccountToken: false

---
# ============================================================
# Frontend Deployment
# FIX (local dev): replicas reduced from 3 to 1. Running 3 replicas
# of backend + 3 of frontend + postgres + redis + qdrant + backup
# CronJobs was consistently overcommitting a single-node laptop
# cluster's CPU/memory, causing "Insufficient cpu"/"Insufficient
# memory" scheduling failures. Bump this back up once you have more
# node capacity or move to a real multi-node cluster.
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:

  name: frontend

  namespace: ai-platform

  labels:

    app: frontend

    component: web

    version: v1

spec:

  replicas: 1

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxSurge: 1

      maxUnavailable: 0

  selector:

    matchLabels:

      app: frontend

  template:

    metadata:

      labels:

        app: frontend

        component: web

      annotations:

        prometheus.io/scrape: "true"

        prometheus.io/port: "3000"

        prometheus.io/path: "/metrics"

    spec:

      serviceAccountName: frontend-service-account

      priorityClassName: normal-priority

      restartPolicy: Always

      terminationGracePeriodSeconds: 30

      dnsPolicy: ClusterFirst

      securityContext:

        runAsNonRoot: true

        runAsUser: 1000

        runAsGroup: 1000

        fsGroup: 1000

      # FIX: imagePullSecrets removed. It referenced
      # "docker-registry-secret", which was deleted from secrets.yaml
      # because it only contained a placeholder value
      # (BASE64_DOCKER_CONFIG), not real registry credentials.
      # Not needed for local (kind/Docker Desktop) development using
      # public images. Re-add this once you have a real registry secret:
      #
      # imagePullSecrets:
      # - name: docker-registry-secret

      topologySpreadConstraints:

      - maxSkew: 1

        topologyKey: kubernetes.io/hostname

        whenUnsatisfiable: ScheduleAnyway

        labelSelector:

          matchLabels:

            app: frontend

      # FIX: nodeAffinity is now correctly nested inside "affinity",
      # alongside podAntiAffinity, instead of being a sibling of it.
      # This was causing: "unknown field spec.template.spec.nodeAffinity"
      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

          - weight: 100

            podAffinityTerm:

              topologyKey: kubernetes.io/hostname

              labelSelector:

                matchLabels:

                  app: frontend

        nodeAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

          - weight: 50

            preference:

              matchExpressions:

              - key: node-role.kubernetes.io/worker

                operator: Exists

      tolerations:

      - key: workload

        operator: Equal

        value: frontend

        effect: NoSchedule

      initContainers:

      - name: wait-for-backend

        image: curlimages/curl:latest

        command:

        - sh

        - -c

        - |

          until curl \
            -fs \
            http://backend-service:8000/health
          do
            echo "Waiting for backend..."
            sleep 3
          done

      # FIX: this whole "containers" + "volumes" block was previously
      # duplicated verbatim further down in the file, which is invalid
      # YAML (duplicate keys under the same template.spec). The
      # duplicate has been removed - only one copy remains below.
      containers:

      - name: frontend

        image: ai-frontend:v2

        imagePullPolicy: IfNotPresent

        ports:

        - name: http

          containerPort: 3000

          protocol: TCP

        envFrom:

        - configMapRef:
            name: ai-platform-config

        env:

        - name: NODE_ENV
          value: production

        - name: PORT
          value: "3000"

        - name: NEXT_TELEMETRY_DISABLED
          value: "1"

        - name: NEXT_PUBLIC_API_URL
          value: "https://api.example.com"

        - name: NEXT_PUBLIC_WS_URL
          value: "wss://api.example.com/ws"

        - name: NEXT_PUBLIC_ENVIRONMENT
          value: production

        - name: NEXT_PUBLIC_ENABLE_ANALYTICS
          value: "true"

        - name: NEXT_PUBLIC_ENABLE_MONITORING
          value: "true"

        - name: NEXT_PUBLIC_ENABLE_RAG
          value: "true"

        - name: NEXT_PUBLIC_ENABLE_AGENTS
          value: "true"

        - name: POD_NAME
          valueFrom:

            fieldRef:

              fieldPath: metadata.name

        - name: POD_NAMESPACE
          valueFrom:

            fieldRef:

              fieldPath: metadata.namespace

        - name: NODE_NAME
          valueFrom:

            fieldRef:

              fieldPath: spec.nodeName

        - name: POD_IP
          valueFrom:

            fieldRef:

              fieldPath: status.podIP

        resources:

          requests:

            cpu: "250m"

            memory: "512Mi"

          limits:

            cpu: "1"

            memory: "1Gi"

        volumeMounts:

        - name: next-cache

          mountPath: /app/.next/cache

        - name: tmp

          mountPath: /tmp

        - name: nginx-cache

          mountPath: /var/cache/nginx

        startupProbe:

          httpGet:

            path: /api/health

            port: http

          periodSeconds: 10

          timeoutSeconds: 5

          failureThreshold: 30

        readinessProbe:

          httpGet:

            path: /api/health

            port: http

          initialDelaySeconds: 10

          periodSeconds: 10

          timeoutSeconds: 5

          failureThreshold: 3

        livenessProbe:

          httpGet:

            path: /api/health

            port: http

          initialDelaySeconds: 30

          periodSeconds: 20

          timeoutSeconds: 5

          failureThreshold: 5

        lifecycle:

          preStop:

            exec:

              command:

              - sh

              - -c

              - |

                echo "Gracefully shutting down frontend"

                sleep 10

        securityContext:

          allowPrivilegeEscalation: false

          readOnlyRootFilesystem: false

          privileged: false

          capabilities:

            drop:

            - ALL

        terminationMessagePolicy: File

      volumes:

      - name: next-cache

        emptyDir:

          sizeLimit: 1Gi

      - name: tmp

        emptyDir: {}

      - name: nginx-cache

        emptyDir:

          sizeLimit: 256Mi

---
# ============================================================
# Frontend Service
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: frontend-service
  namespace: ai-platform

  labels:
    app: frontend

spec:

  type: ClusterIP

  selector:
    app: frontend

  ports:

  - name: http

    port: 3000

    targetPort: http

    protocol: TCP

---
# ============================================================
# Horizontal Pod Autoscaler
# FIX (local dev): minReplicas 3->1, maxReplicas 10->3. Prevents the
# HPA from immediately scaling back up and re-triggering the same
# CPU/memory overcommit we just fixed by lowering "replicas" above.
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:

  name: frontend-hpa

  namespace: ai-platform

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: frontend

  minReplicas: 1

  maxReplicas: 3

  behavior:

    scaleUp:

      stabilizationWindowSeconds: 60

      policies:

      - type: Percent

        value: 100

        periodSeconds: 60

    scaleDown:

      stabilizationWindowSeconds: 300

      policies:

      - type: Percent

        value: 25

        periodSeconds: 60

  metrics:

  - type: Resource

    resource:

      name: cpu

      target:

        type: Utilization

        averageUtilization: 70

  - type: Resource

    resource:

      name: memory

      target:

        type: Utilization

        averageUtilization: 75

---
# ============================================================
# Pod Disruption Budget
# FIX (local dev): minAvailable lowered from 2 to 1, since we only
# run 1 replica now - minAvailable: 2 would have blocked all
# voluntary disruptions on a 1-replica deployment.
# ============================================================

apiVersion: policy/v1
kind: PodDisruptionBudget

metadata:

  name: frontend-pdb

  namespace: ai-platform

spec:

  minAvailable: 1

  selector:

    matchLabels:

      app: frontend

---
# ============================================================
# Service Monitor
# NOTE: Requires the Prometheus Operator CRDs installed.
# Safe to ignore for local dev.
# ============================================================

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:

  name: frontend-monitor

  namespace: monitoring

spec:

  namespaceSelector:

    matchNames:

      - ai-platform

  selector:

    matchLabels:

      app: frontend

  endpoints:

  - port: http

    path: /metrics

    interval: 30s

---
# ============================================================
# Network Policy
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:

  name: frontend-network-policy

  namespace: ai-platform

spec:

  podSelector:

    matchLabels:

      app: frontend

  policyTypes:

    - Ingress
    - Egress

  ingress:

  - from:

    - namespaceSelector:

        matchLabels:

          kubernetes.io/metadata.name: ingress

    ports:

    - protocol: TCP

      port: 3000

  egress:

  - to:

    - podSelector:

        matchLabels:

          app: backend

    ports:

    - protocol: TCP

      port: 8000

  - to:

    - namespaceSelector: {}

---
# ============================================================
# Backend Traffic Policy
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:

  name: frontend-backend-egress

  namespace: ai-platform

spec:

  podSelector:

    matchLabels:

      app: frontend

  policyTypes:

    - Egress

  egress:

  - to:

    - podSelector:

        matchLabels:

          app: backend

    ports:

    - protocol: TCP

      port: 8000

# ============================================================
# FIX: The fake "Endpoints" object (name: frontend-metrics) that used
# to be here has been removed entirely. It hardcoded ip: 127.0.0.1,
# which Kubernetes rejects with:
#   "may not be in the loopback range (127.0.0.0/8, ::1/128)"
# This was a placeholder for manual Prometheus scrape targets and
# isn't needed - real pod IPs are discovered automatically once a
# ServiceMonitor/PodMonitor (Prometheus Operator) is in place.
# ============================================================