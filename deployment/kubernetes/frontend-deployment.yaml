# frontend-deployment.yaml
# ============================================================
# Frontend Service Account
# ============================================================

apiVersion: v1
kind: ServiceAccount

metadata:
  name: frontend-service-account
  namespace: ai-platform

  labels:
    app: frontend

automountServiceAccountToken: false

---
# ============================================================
# Frontend Deployment
# ============================================================

apiVersion: apps/v1
kind: Deployment

metadata:

  name: frontend

  namespace: ai-platform

  labels:

    app: frontend

    component: web

    version: v1

spec:

  replicas: 3

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxSurge: 1

      maxUnavailable: 0

  selector:

    matchLabels:

      app: frontend

  template:

    metadata:

      labels:

        app: frontend

        component: web

      annotations:

        prometheus.io/scrape: "true"

        prometheus.io/port: "3000"

        prometheus.io/path: "/metrics"

    spec:

      serviceAccountName: frontend-service-account

      priorityClassName: normal-priority

      restartPolicy: Always

      terminationGracePeriodSeconds: 30

      dnsPolicy: ClusterFirst

      securityContext:

        runAsNonRoot: true

        runAsUser: 1000

        runAsGroup: 1000

        fsGroup: 1000

      imagePullSecrets:

      - name: docker-registry-secret

      topologySpreadConstraints:

      - maxSkew: 1

        topologyKey: kubernetes.io/hostname

        whenUnsatisfiable: ScheduleAnyway

        labelSelector:

          matchLabels:

            app: frontend

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

          - weight: 100

            podAffinityTerm:

              topologyKey: kubernetes.io/hostname

              labelSelector:

                matchLabels:

                  app: frontend

      nodeAffinity:

        preferredDuringSchedulingIgnoredDuringExecution:

        - weight: 50

          preference:

            matchExpressions:

            - key: node-role.kubernetes.io/worker

              operator: Exists

      tolerations:

      - key: workload

        operator: Equal

        value: frontend

        effect: NoSchedule

      initContainers:

      - name: wait-for-backend

        image: curlimages/curl:latest

        command:

        - sh

        - -c

        - |

          until curl \
            -fs \
            http://backend-service:8000/health
          do
            echo "Waiting for backend..."
            sleep 3
          done
      containers:

      - name: frontend

        image: your-docker-registry/ai-frontend:latest

        imagePullPolicy: Always

        ports:

        - name: http

          containerPort: 3000

          protocol: TCP

        envFrom:

        - configMapRef:
            name: ai-platform-config

        env:

        - name: NODE_ENV
          value: production

        - name: PORT
          value: "3000"

        - name: NEXT_TELEMETRY_DISABLED
          value: "1"

        - name: NEXT_PUBLIC_API_URL
          value: "https://api.example.com"

        - name: NEXT_PUBLIC_WS_URL
          value: "wss://api.example.com/ws"

        - name: NEXT_PUBLIC_ENVIRONMENT
          value: production

        - name: NEXT_PUBLIC_ENABLE_ANALYTICS
          value: "true"

        - name: NEXT_PUBLIC_ENABLE_MONITORING
          value: "true"

        - name: NEXT_PUBLIC_ENABLE_RAG
          value: "true"

        - name: NEXT_PUBLIC_ENABLE_AGENTS
          value: "true"

        - name: POD_NAME
          valueFrom:

            fieldRef:

              fieldPath: metadata.name

        - name: POD_NAMESPACE
          valueFrom:

            fieldRef:

              fieldPath: metadata.namespace

        - name: NODE_NAME
          valueFrom:

            fieldRef:

              fieldPath: spec.nodeName

        - name: POD_IP
          valueFrom:

            fieldRef:

              fieldPath: status.podIP

        resources:

          requests:

            cpu: "250m"

            memory: "512Mi"

          limits:

            cpu: "1"

            memory: "1Gi"

        volumeMounts:

        - name: next-cache

          mountPath: /app/.next/cache

        - name: tmp

          mountPath: /tmp

        - name: nginx-cache

          mountPath: /var/cache/nginx

        startupProbe:

          httpGet:

            path: /api/health

            port: http

          periodSeconds: 10

          timeoutSeconds: 5

          failureThreshold: 30

        readinessProbe:

          httpGet:

            path: /api/health

            port: http

          initialDelaySeconds: 10

          periodSeconds: 10

          timeoutSeconds: 5

          failureThreshold: 3

        livenessProbe:

          httpGet:

            path: /api/health

            port: http

          initialDelaySeconds: 30

          periodSeconds: 20

          timeoutSeconds: 5

          failureThreshold: 5

        lifecycle:

          preStop:

            exec:

              command:

              - sh

              - -c

              - |

                echo "Gracefully shutting down frontend"

                sleep 10

        securityContext:

          allowPrivilegeEscalation: false

          readOnlyRootFilesystem: false

          privileged: false

          capabilities:

            drop:

            - ALL

        terminationMessagePolicy: File

      volumes:

      - name: next-cache

        emptyDir:

          sizeLimit: 1Gi

      - name: tmp

        emptyDir: {}

      - name: nginx-cache

        emptyDir:

          sizeLimit: 256Mi

      containers:

      - name: frontend

        image: your-docker-registry/ai-frontend:latest

        imagePullPolicy: Always

        ports:

        - name: http

          containerPort: 3000

          protocol: TCP

        envFrom:

        - configMapRef:
            name: ai-platform-config

        env:

        - name: NODE_ENV
          value: production

        - name: PORT
          value: "3000"

        - name: NEXT_TELEMETRY_DISABLED
          value: "1"

        - name: NEXT_PUBLIC_API_URL
          value: "https://api.example.com"

        - name: NEXT_PUBLIC_WS_URL
          value: "wss://api.example.com/ws"

        - name: NEXT_PUBLIC_ENVIRONMENT
          value: production

        - name: NEXT_PUBLIC_ENABLE_ANALYTICS
          value: "true"

        - name: NEXT_PUBLIC_ENABLE_MONITORING
          value: "true"

        - name: NEXT_PUBLIC_ENABLE_RAG
          value: "true"

        - name: NEXT_PUBLIC_ENABLE_AGENTS
          value: "true"

        - name: POD_NAME
          valueFrom:

            fieldRef:

              fieldPath: metadata.name

        - name: POD_NAMESPACE
          valueFrom:

            fieldRef:

              fieldPath: metadata.namespace

        - name: NODE_NAME
          valueFrom:

            fieldRef:

              fieldPath: spec.nodeName

        - name: POD_IP
          valueFrom:

            fieldRef:

              fieldPath: status.podIP

        resources:

          requests:

            cpu: "250m"

            memory: "512Mi"

          limits:

            cpu: "1"

            memory: "1Gi"

        volumeMounts:

        - name: next-cache

          mountPath: /app/.next/cache

        - name: tmp

          mountPath: /tmp

        - name: nginx-cache

          mountPath: /var/cache/nginx

        startupProbe:

          httpGet:

            path: /api/health

            port: http

          periodSeconds: 10

          timeoutSeconds: 5

          failureThreshold: 30

        readinessProbe:

          httpGet:

            path: /api/health

            port: http

          initialDelaySeconds: 10

          periodSeconds: 10

          timeoutSeconds: 5

          failureThreshold: 3

        livenessProbe:

          httpGet:

            path: /api/health

            port: http

          initialDelaySeconds: 30

          periodSeconds: 20

          timeoutSeconds: 5

          failureThreshold: 5

        lifecycle:

          preStop:

            exec:

              command:

              - sh

              - -c

              - |

                echo "Gracefully shutting down frontend"

                sleep 10

        securityContext:

          allowPrivilegeEscalation: false

          readOnlyRootFilesystem: false

          privileged: false

          capabilities:

            drop:

            - ALL

        terminationMessagePolicy: File

      volumes:

      - name: next-cache

        emptyDir:

          sizeLimit: 1Gi

      - name: tmp

        emptyDir: {}

      - name: nginx-cache

        emptyDir:

          sizeLimit: 256Mi
---
# ============================================================
# Frontend Service
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: frontend-service
  namespace: ai-platform

  labels:
    app: frontend

spec:

  type: ClusterIP

  selector:
    app: frontend

  ports:

  - name: http

    port: 3000

    targetPort: http

    protocol: TCP

---
# ============================================================
# Horizontal Pod Autoscaler
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:

  name: frontend-hpa

  namespace: ai-platform

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: frontend

  minReplicas: 3

  maxReplicas: 10

  behavior:

    scaleUp:

      stabilizationWindowSeconds: 60

      policies:

      - type: Percent

        value: 100

        periodSeconds: 60

    scaleDown:

      stabilizationWindowSeconds: 300

      policies:

      - type: Percent

        value: 25

        periodSeconds: 60

  metrics:

  - type: Resource

    resource:

      name: cpu

      target:

        type: Utilization

        averageUtilization: 70

  - type: Resource

    resource:

      name: memory

      target:

        type: Utilization

        averageUtilization: 75

---
# ============================================================
# Pod Disruption Budget
# ============================================================

apiVersion: policy/v1
kind: PodDisruptionBudget

metadata:

  name: frontend-pdb

  namespace: ai-platform

spec:

  minAvailable: 2

  selector:

    matchLabels:

      app: frontend

---
# ============================================================
# Service Monitor
# ============================================================

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:

  name: frontend-monitor

  namespace: monitoring

spec:

  namespaceSelector:

    matchNames:

      - ai-platform

  selector:

    matchLabels:

      app: frontend

  endpoints:

  - port: http

    path: /metrics

    interval: 30s

---
# ============================================================
# Network Policy
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:

  name: frontend-network-policy

  namespace: ai-platform

spec:

  podSelector:

    matchLabels:

      app: frontend

  policyTypes:

    - Ingress
    - Egress

  ingress:

  - from:

    - namespaceSelector:

        matchLabels:

          kubernetes.io/metadata.name: ingress

    ports:

    - protocol: TCP

      port: 3000

  egress:

  - to:

    - podSelector:

        matchLabels:

          app: backend

    ports:

    - protocol: TCP

      port: 8000

  - to:

    - namespaceSelector: {}

---
# ============================================================
# Backend Traffic Policy
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:

  name: frontend-backend-egress

  namespace: ai-platform

spec:

  podSelector:

    matchLabels:

      app: frontend

  policyTypes:

    - Egress

  egress:

  - to:

    - podSelector:

        matchLabels:

          app: backend

    ports:

    - protocol: TCP

      port: 8000

---
# ============================================================
# Prometheus Scrape Labels
# ============================================================

apiVersion: v1
kind: Endpoints

metadata:

  name: frontend-metrics

  namespace: ai-platform

  labels:

    app: frontend

    prometheus: enabled

subsets:

- addresses:

  - ip: 127.0.0.1

  ports:

  - name: metrics

    port: 3000