# ingress.yaml
# ============================================================
# Ingress Class
# ============================================================

apiVersion: networking.k8s.io/v1
kind: IngressClass

metadata:
  name: nginx

spec:
  controller: k8s.io/ingress-nginx

---
# ============================================================
# Main Ingress
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:

  name: ai-platform-ingress

  namespace: ai-platform

  annotations:

    kubernetes.io/ingress.class: nginx

    cert-manager.io/cluster-issuer: letsencrypt-prod

    nginx.ingress.kubernetes.io/ssl-redirect: "true"

    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    nginx.ingress.kubernetes.io/proxy-buffer-size: "64k"

    nginx.ingress.kubernetes.io/proxy-buffers-number: "8"

    nginx.ingress.kubernetes.io/enable-cors: "true"

    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.example.com"

    nginx.ingress.kubernetes.io/cors-allow-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"

    nginx.ingress.kubernetes.io/cors-allow-headers: >-
      Authorization,
      Content-Type,
      Accept,
      Origin,
      X-Requested-With

    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"

    nginx.ingress.kubernetes.io/websocket-services: backend-service

    nginx.ingress.kubernetes.io/use-regex: "true"

    nginx.ingress.kubernetes.io/rewrite-target: /$2

spec:

  ingressClassName: nginx

  tls:

  - hosts:

      - api.example.com

      - app.example.com

    secretName: ai-platform-tls

  rules:

  - host: api.example.com

    http:

      paths:

      - path: /()(.*)

        pathType: Prefix

        backend:

          service:

            name: backend-service

            port:

              number: 8000

  - host: app.example.com

    http:

      paths:

      - path: /

        pathType: Prefix

        backend:

          service:

            name: frontend-service

            port:

              number: 3000
---
# ============================================================
# Additional API & AI Routes
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:

  name: ai-platform-api-ingress

  namespace: ai-platform

  annotations:

    kubernetes.io/ingress.class: nginx

    nginx.ingress.kubernetes.io/use-regex: "true"

    nginx.ingress.kubernetes.io/proxy-body-size: "500m"

    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"

    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"

    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"

    nginx.ingress.kubernetes.io/proxy-buffering: "off"

    nginx.ingress.kubernetes.io/enable-websocket: "true"

    nginx.ingress.kubernetes.io/enable-access-log: "true"

    nginx.ingress.kubernetes.io/limit-rps: "200"

    nginx.ingress.kubernetes.io/limit-rpm: "6000"

    nginx.ingress.kubernetes.io/limit-connections: "300"

    nginx.ingress.kubernetes.io/configuration-snippet: |

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

      proxy_http_version 1.1;

spec:

  ingressClassName: nginx

  tls:

  - hosts:

    - api.example.com

    secretName: ai-platform-tls

  rules:

  - host: api.example.com

    http:

      paths:

      # REST API

      - path: /api(/|$)(.*)

        pathType: Prefix

        backend:

          service:

            name: backend-service

            port:

              number: 8000

      # Authentication

      - path: /auth(/|$)(.*)

        pathType: Prefix

        backend:

          service:

            name: backend-service

            port:

              number: 8000

      # AI Endpoints

      - path: /ai(/|$)(.*)

        pathType: Prefix

        backend:

          service:

            name: backend-service

            port:

              number: 8000

      # RAG

      - path: /rag(/|$)(.*)

        pathType: Prefix

        backend:

          service:

            name: backend-service

            port:

              number: 8000

      # Uploads

      - path: /upload(/|$)(.*)

        pathType: Prefix

        backend:

          service:

            name: backend-service

            port:

              number: 8000

      # WebSocket

      - path: /ws(/|$)(.*)

        pathType: Prefix

        backend:

          service:

            name: backend-service

            port:

              number: 8000

      # Executor

      - path: /executor(/|$)(.*)

        pathType: Prefix

        backend:

          service:

            name: backend-service

            port:

              number: 8000
---
# ============================================================
# Default Backend Ingress
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:

  name: default-backend-ingress

  namespace: ai-platform

  annotations:

    kubernetes.io/ingress.class: nginx

    nginx.ingress.kubernetes.io/default-backend: frontend-service

spec:

  ingressClassName: nginx

  defaultBackend:

    service:

      name: frontend-service

      port:

        number: 3000

---
# ============================================================
# TLS Certificate
# ============================================================

apiVersion: cert-manager.io/v1
kind: Certificate

metadata:

  name: ai-platform-tls

  namespace: ai-platform

spec:

  secretName: ai-platform-tls

  issuerRef:

    name: letsencrypt-prod

    kind: ClusterIssuer

  dnsNames:

    - api.example.com

    - app.example.com

---
# ============================================================
# Security Middleware (NGINX Configuration)
# ============================================================

apiVersion: v1
kind: ConfigMap

metadata:

  name: ingress-security-config

  namespace: ingress

data:

  server-snippet: |

    add_header X-Frame-Options "DENY" always;

    add_header X-Content-Type-Options "nosniff" always;

    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    add_header X-XSS-Protection "1; mode=block" always;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    add_header Cross-Origin-Opener-Policy "same-origin" always;

    add_header Cross-Origin-Resource-Policy "same-site" always;

  http-snippet: |

    server_tokens off;

    client_max_body_size 500m;

    proxy_buffering off;

    proxy_request_buffering off;

    keepalive_timeout 75s;

    gzip on;

    gzip_types
      application/json
      application/javascript
      application/xml
      text/css
      text/plain
      text/javascript;

---
# ============================================================
# Optional IP Whitelist Example
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:

  name: ingress-allow-only-nginx

  namespace: ai-platform

spec:

  podSelector: {}

  ingress:

  - from:

    - namespaceSelector:

        matchLabels:

          kubernetes.io/metadata.name: ingress

  policyTypes:

  - Ingress