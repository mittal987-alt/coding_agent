# qdrant.yaml
# ============================================================
# Qdrant Headless Service
# ============================================================

apiVersion: v1
kind: Service

metadata:
  name: qdrant-headless
  namespace: ai-platform

  labels:
    app: qdrant

spec:

  clusterIP: None

  selector:
    app: qdrant

  ports:

  - name: http

    port: 6333

    targetPort: 6333

  - name: grpc

    port: 6334

    targetPort: 6334

---
# ============================================================
# Qdrant ClusterIP Service
# ============================================================

apiVersion: v1
kind: Service

metadata:

  name: qdrant-service

  namespace: ai-platform

  labels:

    app: qdrant

spec:

  type: ClusterIP

  selector:

    app: qdrant

  ports:

  - name: http

    port: 6333

    targetPort: 6333

  - name: grpc

    port: 6334

    targetPort: 6334

---
# ============================================================
# StatefulSet
# ============================================================

apiVersion: apps/v1
kind: StatefulSet

metadata:

  name: qdrant

  namespace: ai-platform

  labels:

    app: qdrant

spec:

  serviceName: qdrant-headless

  replicas: 1

  revisionHistoryLimit: 10

  selector:

    matchLabels:

      app: qdrant

  template:

    metadata:

      labels:

        app: qdrant

      annotations:

        prometheus.io/scrape: "true"

        prometheus.io/port: "6333"

    spec:

      terminationGracePeriodSeconds: 60

      securityContext:

        fsGroup: 1000

      affinity:

        podAntiAffinity:

          preferredDuringSchedulingIgnoredDuringExecution:

          - weight: 100

            podAffinityTerm:

              topologyKey: kubernetes.io/hostname

              labelSelector:

                matchLabels:

                  app: qdrant

      imagePullSecrets:

      - name: docker-registry-secret

      initContainers:

      - name: prepare-storage

        image: busybox:latest

        command:

        - sh

        - -c

        - |

          mkdir -p /qdrant/storage

          mkdir -p /qdrant/snapshots

          mkdir -p /qdrant/temp

          chown -R 1000:1000 /qdrant

        volumeMounts:

        - name: qdrant-storage

          mountPath: /qdrant
      containers:

      - name: qdrant

        image: qdrant/qdrant:v1.13.4

        imagePullPolicy: IfNotPresent

        ports:

        - name: http

          containerPort: 6333

          protocol: TCP

        - name: grpc

          containerPort: 6334

          protocol: TCP

        env:

        - name: QDRANT__SERVICE__HTTP_PORT

          value: "6333"

        - name: QDRANT__SERVICE__GRPC_PORT

          value: "6334"

        - name: QDRANT__STORAGE__STORAGE_PATH

          value: /qdrant/storage

        - name: QDRANT__STORAGE__SNAPSHOTS_PATH

          value: /qdrant/snapshots

        envFrom:

        - configMapRef:

            name: qdrant-config

        - secretRef:

            name: qdrant-secret

        resources:

          requests:

            cpu: "500m"

            memory: "2Gi"

          limits:

            cpu: "4"

            memory: "8Gi"

        volumeMounts:

        - name: qdrant-storage

          mountPath: /qdrant/storage

        - name: qdrant-snapshots

          mountPath: /qdrant/snapshots

        - name: qdrant-temp

          mountPath: /qdrant/temp

        startupProbe:

          httpGet:

            path: /healthz

            port: http

          failureThreshold: 30

          periodSeconds: 10

          timeoutSeconds: 5

        readinessProbe:

          httpGet:

            path: /readyz

            port: http

          initialDelaySeconds: 15

          periodSeconds: 10

          timeoutSeconds: 5

          failureThreshold: 5

        livenessProbe:

          httpGet:

            path: /livez

            port: http

          initialDelaySeconds: 30

          periodSeconds: 20

          timeoutSeconds: 5

          failureThreshold: 5

        lifecycle:

          preStop:

            exec:

              command:

              - sh

              - -c

              - |

                echo "Gracefully shutting down Qdrant..."

                sleep 15

        securityContext:

          runAsNonRoot: true

          runAsUser: 1000

          runAsGroup: 1000

          allowPrivilegeEscalation: false

          capabilities:

            drop:

            - ALL

      volumes:

      - name: qdrant-temp

        emptyDir: {}

      - name: qdrant-snapshots

        emptyDir: {}

  volumeClaimTemplates:

  - metadata:

      name: qdrant-storage

    spec:

      accessModes:

      - ReadWriteOnce

      storageClassName: standard

      resources:

        requests:

          storage: 200Gi
---
# ============================================================
# Qdrant Pod Disruption Budget
# ============================================================

apiVersion: policy/v1
kind: PodDisruptionBudget

metadata:
  name: qdrant-pdb
  namespace: ai-platform

spec:

  minAvailable: 1

  selector:

    matchLabels:

      app: qdrant

---
# ============================================================
# Network Policy
# ============================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:

  name: qdrant-network-policy

  namespace: ai-platform

spec:

  podSelector:

    matchLabels:

      app: qdrant

  policyTypes:

    - Ingress
    - Egress

  ingress:

    - from:

      - podSelector:

          matchLabels:

            app: backend

      - podSelector:

          matchLabels:

            app: worker

      ports:

      - protocol: TCP

        port: 6333

      - protocol: TCP

        port: 6334

  egress:

    - to:

      - namespaceSelector: {}

---
# ============================================================
# Service Monitor
# ============================================================

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor

metadata:

  name: qdrant-monitor

  namespace: monitoring

spec:

  selector:

    matchLabels:

      app: qdrant

  namespaceSelector:

    matchNames:

      - ai-platform

  endpoints:

    - port: http

      path: /metrics

      interval: 30s

      scrapeTimeout: 10s

---
# ============================================================
# Prometheus Alerts
# ============================================================

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:

  name: qdrant-alerts

  namespace: monitoring

spec:

  groups:

    - name: qdrant.rules

      rules:

      - alert: QdrantDown

        expr: up{job="qdrant-monitor"} == 0

        for: 2m

        labels:

          severity: critical

        annotations:

          summary: Qdrant service is unavailable

      - alert: QdrantHighMemory

        expr: process_resident_memory_bytes > 7000000000

        for: 5m

        labels:

          severity: warning

        annotations:

          summary: Qdrant memory usage is high

      - alert: QdrantHighDiskUsage

        expr: |
          (
            node_filesystem_avail_bytes
            /
            node_filesystem_size_bytes
          ) < 0.10

        for: 10m

        labels:

          severity: critical

        annotations:

          summary: Qdrant storage is almost full

---
# ============================================================
# Snapshot CronJob
# ============================================================

apiVersion: batch/v1
kind: CronJob

metadata:

  name: qdrant-snapshot

  namespace: ai-platform

spec:

  schedule: "0 3 * * *"

  successfulJobsHistoryLimit: 7

  failedJobsHistoryLimit: 3

  jobTemplate:

    spec:

      template:

        spec:

          restartPolicy: OnFailure

          containers:

          - name: snapshot

            image: curlimages/curl:latest

            command:

            - sh

            - -c

            - |

              curl \
                -X POST \
                http://qdrant-service:6333/collections/snapshots

            volumeMounts:

            - name: snapshot-storage

              mountPath: /snapshots

          volumes:

          - name: snapshot-storage

            persistentVolumeClaim:

              claimName: qdrant-snapshot-pvc

---
# ============================================================
# Snapshot PVC
# ============================================================

apiVersion: v1
kind: PersistentVolumeClaim

metadata:

  name: qdrant-snapshot-pvc

  namespace: ai-platform

spec:

  accessModes:

    - ReadWriteOnce

  storageClassName: standard

  resources:

    requests:

      storage: 300Gi