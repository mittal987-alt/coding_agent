---
# ============================================================
# NOTE: docker-registry-secret and tls-secret removed.
#
# They previously contained placeholder text
# (BASE64_DOCKER_CONFIG / BASE64_TLS_CERTIFICATE / BASE64_TLS_PRIVATE_KEY)
# instead of real base64 data, which is why kubectl apply failed with
# "illegal base64 data at input byte 6".
#
# Not needed for local (kind/Docker Desktop) development:
#   - docker-registry-secret is only needed if pulling images from a
#     private registry that requires auth.
#   - tls-secret is only needed for HTTPS ingress; for local dev you
#     can use cert-manager later, or skip TLS entirely.
#
# If/when you deploy to a real registry or need TLS, regenerate these
# properly, e.g.:
#   kubectl create secret docker-registry docker-registry-secret \
#     --docker-server=<registry> --docker-username=<user> \
#     --docker-password=<pass> --namespace=ai-platform --dry-run=client -o yaml
#
#   kubectl create secret tls tls-secret \
#     --cert=path/to/tls.crt --key=path/to/tls.key \
#     --namespace=ingress --dry-run=client -o yaml
# ============================================================

---
