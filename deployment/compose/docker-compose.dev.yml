# docker-compose.dev.yml
version: "3.9"

name: ai-software-engineer-dev

services:

# ============================================================
# Backend (Hot Reload)
# ============================================================

  backend:
    container_name: ai-backend-dev

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    env_file:
      - ../../backend/.env

    environment:
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      PYTHONUNBUFFERED: "1"

    volumes:
      - ../../backend:/app
      - backend_cache:/root/.cache

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    networks:
      - ai-network

# ============================================================
# Worker
# ============================================================

  worker:

    container_name: ai-worker-dev

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.worker

    command: >
      celery
      -A app.worker.celery_app
      worker
      --loglevel=DEBUG

    env_file:
      - ../../backend/.env

    environment:
      ENVIRONMENT: development

    volumes:
      - ../../backend:/app

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

    networks:
      - ai-network

# ============================================================
# Frontend (Next.js Hot Reload)
# ============================================================

  frontend:

    container_name: ai-frontend-dev

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.frontend

    command: npm run dev

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"

    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules

    ports:
      - "3000:3000"

    depends_on:
      - backend

    networks:
      - ai-network

# ============================================================
# PostgreSQL
# ============================================================

  postgres:

    image: postgres:16

    container_name: postgres-dev

    restart: unless-stopped

    environment:
      POSTGRES_DB: ai_engineer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_dev:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ai-network

# ============================================================
# Redis
# ============================================================

  redis:

    image: redis:7-alpine

    container_name: redis-dev

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis_dev:/data

    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ai-network

# ============================================================
# Qdrant
# ============================================================

  qdrant:

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.vectordb

    container_name: qdrant-dev

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_dev:/qdrant/storage

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "http://localhost:6333/healthz"
        ]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - ai-network

# ============================================================
# MailHog
# ============================================================

  mailhog:

    image: mailhog/mailhog

    container_name: mailhog

    ports:
      - "1025:1025"
      - "8025:8025"

    networks:
      - ai-network

# ============================================================
# PgAdmin
# ============================================================

  pgadmin:

    image: dpage/pgadmin4

    container_name: pgadmin

    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    networks:
      - ai-network

# ============================================================
# RedisInsight
# ============================================================

  redisinsight:

    image: redis/redisinsight:latest

    container_name: redisinsight

    ports:
      - "5540:5540"

    depends_on:
      - redis

    networks:
      - ai-network

# ============================================================
# Networks
# ============================================================

networks:

  ai-network:
    driver: bridge

# ============================================================
# Volumes
# ============================================================

volumes:

  postgres_dev:

  redis_dev:

  qdrant_dev:

  backend_cache:

  frontend_node_modules:

  pgadmin_data: