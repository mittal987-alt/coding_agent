version: "3.9"

name: ai-software-engineer

services:

  # ============================================================
  # Backend API
  # ============================================================
  backend:
    container_name: ai-backend

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend

    restart: unless-stopped

    env_file:
      - ../../backend/.env

    ports:
      - "8000:8000"

    depends_on:
      redis:
        condition: service_healthy

      qdrant:
        condition: service_healthy

      ollama:
        condition: service_healthy

    networks:
      - ai-network


  # ============================================================
  # Worker
  # ============================================================
  worker:
    container_name: ai-worker

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.worker

    restart: unless-stopped

    env_file:
      - ../../backend/.env

    depends_on:
      redis:
        condition: service_healthy

      ollama:
        condition: service_healthy

    networks:
      - ai-network


  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    container_name: ai-frontend

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_started

    networks:
      - ai-network


  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ai-network


  # ============================================================
  # Qdrant
  # ============================================================
  qdrant:
    container_name: qdrant

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.vectordb

    restart: unless-stopped

    volumes:
      - qdrant_storage:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--spider",
          "http://localhost:6333/healthz"
        ]

      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - ai-network


  # ============================================================
  # Ollama
  # ============================================================
  ollama:
    image: ollama/ollama:latest

    container_name: ollama

    restart: unless-stopped

    volumes:
      - ollama_data:/root/.ollama

    networks:
      - ai-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ollama list >/dev/null 2>&1 || exit 1"
        ]

      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s


  # ============================================================
  # Code Executor
  # ============================================================
  code_executor:
    container_name: code-executor

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.code_executor

    restart: unless-stopped

    volumes:
      - execution_tmp:/tmp/execution

    networks:
      - ai-network


  # ============================================================
  # Nginx
  # ============================================================
  nginx:
    image: nginx:stable-alpine

    container_name: nginx

    restart: unless-stopped

    depends_on:
      frontend:
        condition: service_started

      backend:
        condition: service_started

    ports:
      - "80:80"

    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/conf.d:/etc/nginx/conf.d:ro

    networks:
      - ai-network


# ============================================================
# Network
# ============================================================
networks:

  ai-network:
    driver: bridge


# ============================================================
# Persistent Volumes
# ============================================================
volumes:

  redis_data:

  qdrant_storage:

  qdrant_snapshots:

  ollama_data:

  execution_tmp: