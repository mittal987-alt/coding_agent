# docker-compose.yml
version: "3.9"

name: ai-software-engineer

services:

# ============================================================
# Backend API
# ============================================================

  backend:
    container_name: ai-backend
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend

    restart: unless-stopped

    env_file:
      - ../../backend/.env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    volumes:
      - ../../backend:/app

    networks:
      - ai-network

# ============================================================
# Worker
# ============================================================

  worker:
    container_name: ai-worker

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.worker

    restart: unless-stopped

    env_file:
      - ../../backend/.env

    depends_on:
      redis:
        condition: service_healthy

      postgres:
        condition: service_healthy

    volumes:
      - ../../backend:/app

    networks:
      - ai-network

# ============================================================
# Frontend
# ============================================================

  frontend:

    container_name: ai-frontend

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.frontend

    restart: unless-stopped

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_started

    networks:
      - ai-network

# ============================================================
# PostgreSQL
# ============================================================

  postgres:

    image: postgres:16

    container_name: postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_engineer

    ports:
      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ai-network

# ============================================================
# Redis
# ============================================================

  redis:

    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      retries: 5

    networks:
      - ai-network

# ============================================================
# Vector Database
# ============================================================

  qdrant:

    container_name: qdrant

    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.vectordb

    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

    healthcheck:

      test:
        [
          "CMD",
          "wget",
          "--spider",
          "http://localhost:6333/healthz"
        ]

      interval: 30s
      retries: 5

    networks:
      - ai-network

# ============================================================
# Nginx Reverse Proxy
# ============================================================

  nginx:

    image: nginx:stable-alpine

    container_name: nginx

    restart: unless-stopped

    depends_on:
      - backend
      - frontend

    ports:
      - "80:80"

    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf

    networks:
      - ai-network

# ============================================================
# Networks
# ============================================================

networks:

  ai-network:
    driver: bridge

# ============================================================
# Volumes
# ============================================================

volumes:

  postgres_data:

  redis_data:

  qdrant_storage: