{{- if .Values.backend.autoscaling.enabled }}

# ============================================================
# Backend Horizontal Pod Autoscaler
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:

  name: {{ include "ai-platform.backend.service" . }}

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: {{ include "ai-platform.backend.service" . }}

  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}

  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}

  metrics:

    - type: Resource

      resource:

        name: cpu

        target:

          type: Utilization

          averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }}

    - type: Resource

      resource:

        name: memory

        target:

          type: Utilization

          averageUtilization: {{ .Values.backend.autoscaling.targetMemoryUtilizationPercentage }}

  behavior:

    scaleUp:

      stabilizationWindowSeconds: 60

      selectPolicy: Max

      policies:

        - type: Percent

          value: 100

          periodSeconds: 60

        - type: Pods

          value: 4

          periodSeconds: 60

    scaleDown:

      stabilizationWindowSeconds: 300

      selectPolicy: Min

      policies:

        - type: Percent

          value: 20

          periodSeconds: 60

---

{{- end }}

