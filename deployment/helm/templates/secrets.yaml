{{- if .Values.secrets.existingSecret }}

apiVersion: v1
kind: Secret

metadata:

  name: {{ include "ai-platform.secretName" . }}

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

type: Opaque

stringData:

  # ============================================================
  # Database
  # ============================================================

  DATABASE_URL: ""

  DB_USERNAME: ""

  DB_PASSWORD: ""

  # ============================================================
  # Redis
  # ============================================================

  REDIS_URL: ""

  REDIS_PASSWORD: ""

  # ============================================================
  # Authentication
  # ============================================================

  JWT_SECRET: ""

  SESSION_SECRET: ""

  ENCRYPTION_KEY: ""

  REFRESH_TOKEN_SECRET: ""

  API_KEY: ""

  INTERNAL_API_KEY: ""

---
# ============================================================
# LLM Provider Secrets
# ============================================================

apiVersion: v1
kind: Secret

metadata:

  name: llm-provider-secrets

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

type: Opaque

stringData:

  OPENAI_API_KEY: ""

  ANTHROPIC_API_KEY: ""

  GOOGLE_API_KEY: ""

  MISTRAL_API_KEY: ""

  AZURE_OPENAI_API_KEY: ""

  COHERE_API_KEY: ""

---
# ============================================================
# SMTP Secret
# ============================================================

apiVersion: v1
kind: Secret

metadata:

  name: smtp-secret

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

type: Opaque

stringData:

  SMTP_USERNAME: ""

  SMTP_PASSWORD: ""

{{- end }}

---
# ============================================================
# GitHub OAuth Secret
# ============================================================

apiVersion: v1
kind: Secret

metadata:

  name: github-secret

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

type: Opaque

stringData:

  GITHUB_CLIENT_ID: ""

  GITHUB_CLIENT_SECRET: ""

  GITHUB_WEBHOOK_SECRET: ""

---
# ============================================================
# GitLab OAuth Secret
# ============================================================

apiVersion: v1
kind: Secret

metadata:

  name: gitlab-secret

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

type: Opaque

stringData:

  GITLAB_CLIENT_ID: ""

  GITLAB_CLIENT_SECRET: ""

  GITLAB_WEBHOOK_SECRET: ""

---
# ============================================================
# Docker Registry Pull Secret (Example)
# ============================================================

apiVersion: v1
kind: Secret

metadata:

  name: docker-registry-secret

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

type: kubernetes.io/dockerconfigjson

data:

  .dockerconfigjson: ""

---
# ============================================================
# TLS Certificate Secret (Optional)
# ============================================================

apiVersion: v1
kind: Secret

metadata:

  name: tls-secret

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

type: kubernetes.io/tls

data:

  tls.crt: ""

  tls.key: ""

---
# ============================================================
# External Secrets (Optional)
# Compatible with External Secrets Operator
# ============================================================

apiVersion: external-secrets.io/v1beta1

kind: ExternalSecret

metadata:

  name: ai-platform-secrets

  namespace: {{ include "ai-platform.namespace" . }}

spec:

  refreshInterval: 1h

  secretStoreRef:

    kind: ClusterSecretStore

    name: vault-backend

  target:

    name: {{ include "ai-platform.secretName" . }}

    creationPolicy: Owner

  data:

    - secretKey: DATABASE_URL

      remoteRef:

        key: ai-platform/database

        property: url

    - secretKey: JWT_SECRET

      remoteRef:

        key: ai-platform/auth

        property: jwt

    - secretKey: REDIS_URL

      remoteRef:

        key: ai-platform/redis

        property: url

    - secretKey: OPENAI_API_KEY

      remoteRef:

        key: ai-platform/llm

        property: openai

    - secretKey: ANTHROPIC_API_KEY

      remoteRef:

        key: ai-platform/llm

        property: anthropic

    - secretKey: GOOGLE_API_KEY

      remoteRef:

        key: ai-platform/llm

        property: google

    - secretKey: MISTRAL_API_KEY

      remoteRef:

        key: ai-platform/llm

        property: mistral