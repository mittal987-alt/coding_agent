 apiVersion: apps/v1
kind: Deployment

metadata:

  name: {{ include "ai-platform.backend.service" . }}

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

spec:

  replicas: {{ .Values.backend.replicaCount }}

  revisionHistoryLimit: 10

  strategy:

    type: RollingUpdate

    rollingUpdate:

      maxUnavailable: 25%

      maxSurge: 25%

  selector:

    matchLabels:

{{ include "ai-platform.selectorLabels" . | indent 6 }}

      app.kubernetes.io/component: backend

  template:

    metadata:

      labels:

{{ include "ai-platform.selectorLabels" . | indent 8 }}

        app.kubernetes.io/component: backend

{{- with .Values.commonLabels }}

{{ toYaml . | indent 8 }}

{{- end }}

      annotations:

{{ include "ai-platform.annotations" . | indent 8 }}

        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}

        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}

    spec:

      serviceAccountName: {{ include "ai-platform.serviceAccountName" . }}

{{- if .Values.global.imagePullSecrets }}

      imagePullSecrets:

{{ toYaml .Values.global.imagePullSecrets | indent 8 }}

{{- end }}

      securityContext:

{{ include "ai-platform.podSecurityContext" . | indent 8 }}

      containers:

        - name: backend

          image: {{ include "ai-platform.backend.image" . }}

          imagePullPolicy: IfNotPresent

          ports:

            - name: http

              containerPort: 8000

              protocol: TCP

            - name: metrics

              containerPort: 9090

              protocol: TCP

          envFrom:

            - configMapRef:

                name: {{ include "ai-platform.configMapName" . }}

            - secretRef:

                name: {{ include "ai-platform.secretName" . }}
          env:

            - name: POD_NAME

              valueFrom:

                fieldRef:

                  fieldPath: metadata.name

            - name: POD_NAMESPACE

              valueFrom:

                fieldRef:

                  fieldPath: metadata.namespace

            - name: NODE_NAME

              valueFrom:

                fieldRef:

                  fieldPath: spec.nodeName

            - name: POD_IP

              valueFrom:

                fieldRef:

                  fieldPath: status.podIP

            - name: SERVICE_ACCOUNT

              valueFrom:

                fieldRef:

                  fieldPath: spec.serviceAccountName

{{ include "ai-platform.env" . | indent 12 }}

          resources:

            requests:

              cpu: {{ .Values.backend.resources.requests.cpu }}

              memory: {{ .Values.backend.resources.requests.memory }}

            limits:

              cpu: {{ .Values.backend.resources.limits.cpu }}

              memory: {{ .Values.backend.resources.limits.memory }}

          securityContext:

{{ include "ai-platform.containerSecurityContext" . | indent 12 }}

          volumeMounts:

            - name: app-config

              mountPath: /app/config

              readOnly: true

            - name: app-secrets

              mountPath: /app/secrets

              readOnly: true

            - name: workspace

              mountPath: /workspace

            - name: cache

              mountPath: /cache

            - name: logs

              mountPath: /var/log/app

      volumes:

        - name: app-config

          configMap:

            name: {{ include "ai-platform.configMapName" . }}

        - name: app-secrets

          secret:

            secretName: {{ include "ai-platform.secretName" . }}

        - name: workspace

          emptyDir:

            sizeLimit: 10Gi

        - name: cache

          emptyDir:

            sizeLimit: 2Gi

        - name: logs

          emptyDir:

            sizeLimit: 2Gi
          livenessProbe:

            httpGet:

              path: /health

              port: http

            initialDelaySeconds: 30

            periodSeconds: 15

            timeoutSeconds: 5

            successThreshold: 1

            failureThreshold: 3

          readinessProbe:

            httpGet:

              path: /ready

              port: http

            initialDelaySeconds: 10

            periodSeconds: 10

            timeoutSeconds: 5

            successThreshold: 1

            failureThreshold: 3

          startupProbe:

            httpGet:

              path: /live

              port: http

            initialDelaySeconds: 10

            periodSeconds: 10

            timeoutSeconds: 5

            successThreshold: 1

            failureThreshold: 30

          lifecycle:

            postStart:

              exec:

                command:

                  - /bin/sh

                  - -c

                  - |

                    echo "Backend started successfully."

            preStop:

              exec:

                command:

                  - /bin/sh

                  - -c

                  - |

                    echo "Gracefully shutting down..."

                    sleep 15

      terminationGracePeriodSeconds: 60

      restartPolicy: Always

      dnsPolicy: ClusterFirst

      schedulerName: default-scheduler

{{- if .Values.priorityClassName }}

      priorityClassName: {{ .Values.priorityClassName }}

{{- end }}

{{- with .Values.hostAliases }}

      hostAliases:

{{ toYaml . | indent 8 }}

{{- end }}

      nodeSelector:

{{ include "ai-platform.nodeSelector" . | indent 8 }}

      affinity:

{{ include "ai-platform.affinity" . | indent 8 }}

      tolerations:

{{ include "ai-platform.tolerations" . | indent 8 }}

{{- with .Values.topologySpreadConstraints }}

      topologySpreadConstraints:

{{ include "ai-platform.topologySpreadConstraints" . | indent 8 }}

{{- end }}
{{- /*
============================================================
Backend Deployment
Part 4/4
============================================================
*/ -}}

{{- if .Values.backend.initContainers.enabled }}

      initContainers:

        - name: wait-for-postgres

          image: {{ .Values.backend.initContainers.image | default "busybox:1.36" }}

          imagePullPolicy: IfNotPresent

          command:

            - sh

            - -c

            - |

              until nc -z {{ include "ai-platform.fullname" . }}-postgres 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

        - name: wait-for-redis

          image: {{ .Values.backend.initContainers.image | default "busybox:1.36" }}

          imagePullPolicy: IfNotPresent

          command:

            - sh

            - -c

            - |

              until nc -z {{ include "ai-platform.fullname" . }}-redis-master 6379; do
                echo "Waiting for Redis..."
                sleep 2
              done

{{- if .Values.qdrant.enabled }}

        - name: wait-for-qdrant

          image: {{ .Values.backend.initContainers.image | default "busybox:1.36" }}

          imagePullPolicy: IfNotPresent

          command:

            - sh

            - -c

            - |

              until nc -z {{ include "ai-platform.fullname" . }}-qdrant 6333; do
                echo "Waiting for Qdrant..."
                sleep 2
              done

{{- end }}

{{- end }}

{{- with .Values.imagePullSecrets }}

      imagePullSecrets:

{{ toYaml . | indent 8 }}

{{- end }}

{{- with .Values.serviceAccount }}

      serviceAccountName: {{ default (include "ai-platform.serviceAccountName" $) .name }}

{{- end }}

{{- if .Values.backend.podDisruptionBudget.enabled }}

---
apiVersion: policy/v1

kind: PodDisruptionBudget

metadata:

  name: {{ include "ai-platform.backend.service" . }}-pdb

  namespace: {{ include "ai-platform.namespace" . }}

  labels:

{{ include "ai-platform.labels" . | indent 4 }}

spec:

  minAvailable: {{ .Values.backend.podDisruptionBudget.minAvailable | default 1 }}

  selector:

    matchLabels:

{{ include "ai-platform.selectorLabels" . | indent 6 }}

      app.kubernetes.io/component: backend

{{- end }}