# ============================================================
# Production Global Configuration
# ============================================================

global:

  environment: production

  storageClass: premium-ssd

  timezone: Asia/Kolkata

  imagePullSecrets:

    - docker-registry-secret

# ============================================================
# Images
# ============================================================

images:

  backend:

    repository: ghcr.io/your-org/ai-platform-backend

    tag: "1.0.0"

    pullPolicy: IfNotPresent

  frontend:

    repository: ghcr.io/your-org/ai-platform-frontend

    tag: "1.0.0"

    pullPolicy: IfNotPresent

  worker:

    repository: ghcr.io/your-org/ai-platform-worker

    tag: "1.0.0"

    pullPolicy: IfNotPresent

  codeExecutor:

    repository: ghcr.io/your-org/code-executor

    tag: "1.0.0"

    pullPolicy: IfNotPresent

# ============================================================
# Backend
# ============================================================

backend:

  replicaCount: 5

  resources:

    requests:

      cpu: "1"

      memory: 2Gi

    limits:

      cpu: "4"

      memory: 8Gi

  autoscaling:

    enabled: true

    minReplicas: 5

    maxReplicas: 30

    targetCPUUtilizationPercentage: 70

    targetMemoryUtilizationPercentage: 75

# ============================================================
# Frontend
# ============================================================

frontend:

  replicaCount: 3

  resources:

    requests:

      cpu: 500m

      memory: 1Gi

    limits:

      cpu: "2"

      memory: 4Gi

  autoscaling:

    enabled: true

    minReplicas: 3

    maxReplicas: 15

# ============================================================
# Worker
# ============================================================

worker:

  replicaCount: 4

  concurrency: 8

  autoscaling:

    enabled: true

    minReplicas: 4

    maxReplicas: 25

# ============================================================
# Code Executor
# ============================================================

codeExecutor:

  replicaCount: 3

  executionTimeout: 60

  memoryLimitMB: 4096

  workspaceSize: 20Gi

  resources:

    requests:

      cpu: "2"

      memory: 4Gi

    limits:

      cpu: "8"

      memory: 16Gi
