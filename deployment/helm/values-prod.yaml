  # ============================================================
# Production Environment
# ============================================================

env:

  APP_ENV: production

  LOG_LEVEL: INFO

  API_PREFIX: /api/v1

  TZ: Asia/Kolkata

  WORKERS: 8

  CORS_ORIGINS:

    - https://app.example.com

    - https://admin.example.com

# ============================================================
# Secrets
# ============================================================

secrets:

  existingSecret: ai-platform-secrets

  databaseUrlKey: DATABASE_URL

  redisUrlKey: REDIS_URL

  jwtSecretKey: JWT_SECRET

  sessionSecretKey: SESSION_SECRET

  encryptionKey: ENCRYPTION_KEY

# ============================================================
# AI Providers
# ============================================================

llm:

  provider: openai

  embeddingProvider: openai

  fallbackProvider: mistral

  requestTimeout: 120

  maxRetries: 5

  providers:

    openai:

      enabled: true

      existingSecret: llm-provider-secrets

      apiKeyKey: OPENAI_API_KEY

    anthropic:

      enabled: true

      existingSecret: llm-provider-secrets

      apiKeyKey: ANTHROPIC_API_KEY

    google:

      enabled: true

      existingSecret: llm-provider-secrets

      apiKeyKey: GOOGLE_API_KEY

    mistral:

      enabled: true

      existingSecret: llm-provider-secrets

      apiKeyKey: MISTRAL_API_KEY

# ============================================================
# Feature Flags
# ============================================================

features:

  rag: true

  semanticSearch: true

  aiChat: true

  codeExecution: true

  websocket: true

  githubIntegration: true

  gitlabIntegration: true

  usageAnalytics: true

  telemetry: true

# ============================================================
# SMTP
# ============================================================

smtp:

  enabled: true

  existingSecret: smtp-secret

  host: smtp.example.com

  port: 587

  from: noreply@example.com

# ============================================================
# Git Integrations
# ============================================================

git:

  github:

    enabled: true

    existingSecret: github-secret

  gitlab:

    enabled: true

    existingSecret: gitlab-secret

# ============================================================
# Scheduling
# ============================================================

nodeSelector:

  kubernetes.io/os: linux

tolerations:

  - key: workload

    operator: Equal

    value: production

    effect: NoSchedule

affinity:

  podAntiAffinity:

    preferredDuringSchedulingIgnoredDuringExecution:

      - weight: 100

        podAffinityTerm:

          topologyKey: topology.kubernetes.io/zone

# ============================================================
# Security
# ============================================================

security:

  podSecurityContext:

    runAsNonRoot: true

    fsGroup: 1000

  containerSecurityContext:

    runAsUser: 1000

    runAsGroup: 1000

    allowPrivilegeEscalation: false

    readOnlyRootFilesystem: false

    capabilities:

      drop:

        - ALL

    seccompProfile:

      type: RuntimeDefault

# ============================================================
# Common Labels
# ============================================================

commonLabels:

  environment: production

  app.kubernetes.io/name: ai-software-engineer

  app.kubernetes.io/component: platform

  app.kubernetes.io/managed-by: Helm

# ============================================================
# Common Annotations
# ============================================================

commonAnnotations:

  prometheus.io/scrape: "true"

  prometheus.io/path: /metrics

  prometheus.io/port: "8000"

  backup/enabled: "true"

  security/open-policy-agent: "enabled"